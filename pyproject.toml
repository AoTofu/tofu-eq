[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tofu-eq"
dynamic = ["version"]
description = "Lightweight system-wide parametric equalizer for PipeWire"
readme = "README.md"
license = "MIT"
authors = [{ name = "AoTofu" }]
requires-python = ">=3.9"
dependencies = ["PySide6-Essentials>=6.5", "numpy"]
keywords = ["equalizer", "eq", "pipewire", "audio", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/AoTofu/tofu-eq"
Issues = "https://github.com/AoTofu/tofu-eq/issues"

[project.gui-scripts]
tofu-eq = "tofu_eq.__main__:main"

[tool.setuptools]
packages = ["tofu_eq"]

[tool.setuptools.dynamic]
version = { attr = "tofu_eq.__version__" }
